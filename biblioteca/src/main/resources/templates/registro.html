<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagina Principal</title>
<link rel="stylesheet" th:href="@{/css/general.css}" />
<link rel="stylesheet" th:href="@{/css/index.css}" />
<link rel="stylesheet" media="(max-width: 600px)" th:href="@{/css/movil.css}" />
<link rel="stylesheet" media="(min-width: 600px) and (max-width: 800px)" th:href="@{/css/tablet.css}" />
<link rel="stylesheet" media="(min-width: 800px)" th:href="@{/css/pc.css}" />
<link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />
</head>

<body>
	<div id="tapar"></div>
	<header>
		<h2>
			<a th:href="@{/}">Biblioteca</a>
		</h2>
		<!--Esto será luego una imagen o algo asi-->
		<div sec:authorize="isAuthenticated()">
			<h2 id="mensajeBienvenida" th:inline="text">
				<a th:href="@{/}">
					¡Hola,	<span th:remove="tag" sec:authentication="name"> </span>!
				</a>

			</h2>
		</div>
	</header>

	<aside id="menuMovil">
		<img src="/images/close_black_24dp.svg">
		<h3>
			<a th:href="@{/}">Inicio</a>
		</h3>
		<h3>
			<a th:href="@{/tienda}">Libros</a>
		</h3>
		<h3>
			<a th:href="@{/contacto}">Contacto</a>
		</h3>
		<!--solo puede haber 1 de estos dos activo-->
		<h3>
			<a href="proximamente.html">Cuenta</a>
		</h3>
		<h3>
			<a th:href="@{/login}">Login</a>
		</h3>
	</aside>
	<nav>
		<h3>
			<a th:href="@{/}">Inicio</a>
		</h3>
		<h3>
			<a th:href="@{/tienda}">Libros</a>
		</h3>
		<h3>
			<a th:href="@{/contacto}">Contacto</a>
		</h3>
		<!--solo puede haber 1 de estos dos activo-->
		<h3 sec:authorize="isAnonymous()">
			<a th:href="@{/login}">Cuenta</a>
		</h3>
		<h3 sec:authorize="isAuthenticated()">
    		<a th:href="@{/usuarios/{idUsuario}(idUsuario=${#authentication.name})}">Cuenta</a>
		</h3>
		<div sec:authorize="hasRole('ROLE_ADMIN')">
			<h3>
				<a th:href="@{/adminIndex}">Admin</a>
			</h3>
		</div>
		<div sec:authorize="isAuthenticated()">
			<form th:action="@{/logout}" method="post">
				<h3>
					<input id="logoutBoton" type="submit" value="Logout" />
				</h3>
			</form>
		</div>

		<!-- SI NO SE HA AUTENTICADO -->
		<div sec:authorize="isAnonymous()">
			<h3>
				<a href="/login">Login</a>
			</h3>
		</div>
		<!---->
		<img th:src="@{/images/menu_black_24dp.svg}" id="btnMenuMovil" />
	</nav>
	<section id="seccionRegistro">
		<h1>Registro</h1>
		<form th:action="@{/usuarios/save}" method="post" th:object="${usuarioDTO}">
			<input type="email" id="registroEmail" placeholder="Correo Electronico" th:field="*{email}"> 
			<input type="text" id="registroUser" placeholder="Nombre de Usuario" th:field="*{username}"> 
			<input type="text" id="registroNombre" placeholder="Nombre" th:field="*{nombre}"> 
			<input type="text" id="registroApellidos" placeholder="Apellidos" th:field="*{apellidos}">
			<input type="text" id="registroDNI" placeholder="NIF" th:field="*{nif}"> 
			<input type="text" id="registroPass" placeholder="Contraseña" th:field="*{password}"> 
			<input type="text" id="registroPass2" placeholder="Repetir Contraseña">
			<label>Roles:
			<input type="checkbox" name="roles"	text="ADMIN" value="ROLE_ADMIN">ADMIN</input>
			<input type="checkbox" name="roles"	text="USER" value="ROLE_USER">USER</input>
			</label>
			<button id="btnRegistro" type="submit">Registrar</button>
		</form>
	</section>
		<div>
			<span>Login</span><span>Registro</span>
		</div>
</body>
</html>
